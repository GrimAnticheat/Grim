# ===========================================================================
#  Paramètres du backend Postgres.
#
#  Postgres supporte les déploiements multi-serveurs (plusieurs instances
#  Grim écrivent dans une BD centrale). Nécessite le driver JDBC Postgres
#  au runtime ; s'il manque, le backend se désactive au démarrage et le
#  routing qui le visait retombe sur son fallback.
# ===========================================================================

# Toutes les clés vivent sous `postgres:` pour que le keyspace de ce
# fichier n'entre pas en collision avec les fichiers de backends voisins
# quand Configuralize les fusionne dans un namespace global.
postgres:
  host: "localhost"
  port: 5432
  database: "grim"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Grim instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # Paramètres d'URL supplémentaires ajoutés après `?`. Laissez vide sauf
  # besoin spécifique.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Overrides de noms de table. Défauts ci-dessous.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Marqueurs de schéma — voir le commentaire d'en-tête dans config.yml.
config-flavor: V2
config-version: 2
