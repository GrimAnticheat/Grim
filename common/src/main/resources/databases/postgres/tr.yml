# ===========================================================================
#  Postgres backend ayarları.
#
#  Postgres çoklu sunuculu kurulumları destekler (birden çok Grim
#  instance'ı tek bir merkezi DB'ye yazar). Çalışma zamanında Postgres
#  JDBC sürücüsünü gerektirir; sürücü yoksa backend başlangıçta kendini
#  devre dışı bırakır ve buraya yönlenen routing fallback'ine düşer.
# ===========================================================================

# Tüm anahtarlar `postgres:` altında yer alır; böylece Configuralize
# tümünü tek bir global ad alanında birleştirdiğinde bu dosyanın anahtar
# uzayı kardeş backend dosyalarıyla çakışmaz.
postgres:
  host: "localhost"
  port: 5432
  database: "grim"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Grim instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # `?` sonrasına eklenen ek URL parametreleri. Belirli bir gereksinim
  # yoksa boş bırak.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Tablo adı geçersiz kılmaları. Varsayılanlar aşağıda.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Şema işaretçileri — bkz. config.yml'deki başlık yorumu.
config-flavor: V2
config-version: 2
