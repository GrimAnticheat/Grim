# ===========================================================================
#  Ajustes del backend Postgres.
#
#  Postgres admite despliegues multi-servidor (varias instancias de Grim
#  escribiendo en una BD central). Requiere el driver JDBC de Postgres en
#  runtime; si falta, el backend se autodesactiva al arrancar y el routing
#  que apuntaba aquí cae en su fallback.
# ===========================================================================

# Todas las claves van bajo `postgres:` para que el keyspace de este
# archivo no colisione con archivos hermanos por backend cuando
# Configuralize los une en un namespace global.
postgres:
  host: "localhost"
  port: 5432
  database: "grim"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Grim instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # Parámetros de URL extra que se añaden tras `?`. Déjalo vacío salvo que
  # sepas que necesitas algo específico.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Overrides de nombres de tabla. Defaults abajo.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Marcadores de esquema — ver el comentario de cabecera en config.yml.
config-flavor: V2
config-version: 2
