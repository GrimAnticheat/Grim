# ===========================================================================
#  Configurações do backend Postgres.
#
#  Postgres suporta deploys multi-servidor (várias instâncias do Grim
#  escrevendo num BD central). Requer o driver JDBC do Postgres em
#  runtime; se ele faltar, o backend se desativa no startup e o routing
#  que apontava para ele cai no seu fallback.
# ===========================================================================

# Todas as chaves vivem sob `postgres:` para que o keyspace deste arquivo
# não colida com arquivos irmãos por backend quando Configuralize os funde
# num namespace global.
postgres:
  host: "localhost"
  port: 5432
  database: "grim"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Grim instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # Parâmetros de URL extras anexados após `?`. Deixe vazio salvo se
  # precisar de algo específico.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Overrides de nome de tabela. Defaults abaixo.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Marcadores de esquema — ver o comentário do cabeçalho em config.yml.
config-flavor: V2
config-version: 2
