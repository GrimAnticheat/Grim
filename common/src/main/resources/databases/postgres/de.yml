# ===========================================================================
#  Postgres-Backend-Einstellungen.
#
#  Postgres unterstützt Multi-Server-Deployments (mehrere Grim-Instanzen
#  schreiben in eine zentrale DB). Benötigt zur Laufzeit den Postgres-JDBC-
#  Treiber; fehlt der Treiber, deaktiviert sich das Backend beim Start und
#  Routing, das auf dieses Backend zeigte, fällt zurück.
# ===========================================================================

# Alle Schlüssel liegen unter `postgres:`, damit der Keyspace dieser Datei
# nicht mit Geschwister-Backend-Dateien kollidiert, wenn Configuralize alle
# in einen globalen Namespace merged.
postgres:
  host: "localhost"
  port: 5432
  database: "grim"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Grim instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # Zusätzliche URL-Parameter, die nach `?` angehängt werden. Leer lassen,
  # falls du nichts Spezifisches brauchst.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Tabellennamen-Overrides. Defaults unten.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Schema-Marker — siehe Kopf-Kommentar in config.yml.
config-flavor: V2
config-version: 2
