# config.yml - GrimAC 核心配置
# 项目源码: https://github.com/MWHunter/Grim
# 版权声明 © 2025 DefineOutside 及贡献者 / 使用 GPLv3 开源协议
# 重要提示：修改后的插件或包含Grim代码的衍生作品不得公开销售，需保持私有

alerts:
    # 除了向有权限的玩家发送作弊vl外，是否在控制台打印玩家作弊记录？（默认开启）
    print-to-console: true
    # 跨服作弊警报设置（Velocity代理需配合开启` bungee-plugin-message-channel `使用）
    proxy:
        # 是否向其他子服发送本服作弊警报？
        send: false
        # 是否接收其他子服的作弊警报？
        receive: false

verbose:
    # 是否在控制台显示详细调试(verbose)信息？（默认关闭）
    print-to-console: false

# 是否自动检查插件更新？（推荐开启）
check-for-updates: true

client-brand:
    # 符合这些名称的客户端不显示版本提示（正则表达式匹配）
    ignored-clients:
        - "^vanilla$"        # 原版客户端
        - "^fabric$"         # Fabric客户端
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}$"  # Lunar客户端
        - "^Feather Fabric$" # Feather客户端
        - "^labymod$"        # LabyMod客户端
    # 是否禁止携带攻击距离修改功能的Forge客户端进入？（1.18.2-1.19.3版本）
    # 关闭可能带来安全风险（强烈建议保持开启）
    disconnect-blacklisted-forge-versions: true

spectators:
    # 拥有grim.spectator权限的玩家是否始终隐身？（默认关闭）
    hide-regardless: false
    # 观察者模式在这些世界不生效（留空=全部世界生效）
    allowed-worlds:
        - ""

# 玩家数据（transaction 数据包）超时踢出时间（单位: 秒），原因显示"disconnect.timeout"
max-transaction-time: 60

# 是否修复桶放置不同步（bucket desync）问题（MC-12363漏洞→ https://bugs.mojang.com/browse/MC-12363）
# 注：仅影响1.8服务器中的1.17-1.20.5玩家，Mojang已在1.21修复
cancel-duplicate-packet: true

# 是否忽略重复数据包中的玩家视角转动？
ignore-duplicate-packet-rotation: false

Simulation:
    # 玩家行为正常时，违规值衰减速度乘区（值越小衰减越快）
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # 玩家移动偏移判定阈值（单位：方块）
    # 0.001可减少FastMath误报（针对Optifine优化）
    # 如果此补偿不起作用，则反作弊记录此玩家作弊
    threshold: 0.001
    # 单次移动超标立即回弹阈值（-1=关闭）
    # 假设作弊者与模拟移动的阈值（threshold）是0.0945，该项目设置的是0.07，玩家会立即被回弹到合适的位置
    immediate-setback-threshold: 0.1
    # 累计移动超标回弹阈值（-1=关闭）
    # 假设作弊者与模拟移动的阈值（threshold）是0.0945，并且触发了10次，应为0.9450
    # 而你设置的值为0.94 ， 作弊者会受到回弹
    max-advantage: 1
    # 最大违规值上限（防止永久记录）
    # 在默认配置的50秒后，玩家将从4块跑到1块
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # 触发回弹所需的最低违规等级
    # 1 为旧行为
    setback-violation-threshold: 1

# 穿墙检测设置
Phase:
    setbackvl: 1  # 触发回弹的违规等级
    decay: 0.005  # 违规值衰减速度

# 以下为物品放置类检测（cancelvl=触发取消操作的违规等级）
AirLiquidPlace:   # 空中/液体放置
    cancelvl: 0
FabricatedPlace:  # 异常位置放置
    cancelvl: 5
FarPlace:         # 超远距离放置
    cancelvl: 5
PositionPlace:    # 位置异常放置
    cancelvl: 5
RotationPlace:    # 角度异常放置
    cancelvl: 5

# 防减速绕过检测
NoSlow:
    threshold: 0.001  # 移动偏移判定阈值，标志 0.03-0.2 与 NoSlow 一致
    setbackvl: 5      # 触发回弹的违规等级
    decay: 0.05       # 正常减速时违规值衰减量

# 击退检测
Knockback:
    # 玩家行为正常时，违规值衰减速度乘区（值越小衰减越快）
    setback-decay-multiplier: 0.999
    # 玩家移动偏移判定阈值（单位：方块）
    threshold: 0.001
    # 单次移动超标立即回弹阈值（-1=关闭）
    immediate-setback-threshold: 0.1
    # 累计移动超标回弹阈值（-1=关闭）
    max-advantage: 1
    # 最大违规值上限（防止永久记录）
    max-ceiling: 4

# 爆炸击退检测
Explosion:
    threshold: 0.001
    setbackvl: 3

# 计时器加速检测
TimerA:
    setbackvl: 10
    # 允许的延迟缓冲值（毫秒），防止网络波动误判
    # 如果设置得太高，可能会允许 1.8 快速使用/快速治疗/快速弓箭绕过，120 毫秒似乎是一个很好的平衡
    drift: 120

# 防TimerA机制滥用
TimerLimit:
    # 延迟超过此值(ms)时暂停检测（-1=关闭）
    # 在合法玩家的延迟超过这个延迟阈值时可能会造成误拉回
    ping-abuse-limit-threshold: 1000

# 负计时器检测
NegativeTimer:
    # 允许的时间丢失量（毫秒）
    drift: 1200

# 坐骑加速器检测
# 与 TimerA 相同的检查方法，但适用于坐骑
VehicleTimer:
    setbackvl: 10

# 数据包顺序检测
PacketOrderI:
    # 是否豁免1.7动画模组使用者？(默认: 关闭)
    exempt-placing-while-digging: false

# 攻击距离检测
Reach:
    threshold: 0.0005      # 碰撞箱扩展量（检测3.0005+范围）
    block-impossible-hits: true  # 是否直接取消不可能的攻击？
    # 是否启用额外数据包增强检测？（增加带宽消耗）
    # 除非你是专注于 1.8 PvP 的服务器，否则不建议使用这个额外的数据包
    enable-post-packet: false

# 特殊行为控制
exploit:
    # 鞘翅飞行时是否允许疾跑跳跃
    allow-sprint-jumping-when-using-elytra: true
    # 是否允许在幽灵方块上放置方块 (默认: 开启)
    # 这可以在玩家遇到幽灵方块时进行同步，这可以减少玩家所碰到幽灵方块
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2  # 检测幽灵方块的范围

# 启用在加入时注入 netty 的日志插件以调试兼容性问题（仅开发者使用）
debug-pipeline-on-join: false

# 启用实验性检测（可能不稳定）
experimental-checks: false

# 物品使用重置（修复异常交互）
reset-item-usage-on-item-update: true # 重置物品使用中的更新
reset-item-usage-on-attack: true # 重置物品使用中的攻击
reset-item-usage-on-slot-change: true # 重置物品使用中的物品栏切换

# 数据包洪水攻击防护
packet-spam-threshold: 100  # 每秒取消数据包超过此值则踢出
debug-packet-cancel: false  # 是否打印踢出时的错误详情？

# 连接限制（-1=关闭）
max-ping-out-of-flying: 1000     # 非飞行状态最大延迟(ms)

# 这个限制可以解决高延迟的玩家可以使用鞘翅时一直使用 1 个烟花就可以加速
max-ping-firework-boost: 1000    # 鞘翅烟花加速最大延迟(ms)

# 配置文件版本（勿修改）
config-version: 9
