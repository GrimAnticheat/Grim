# %check_name% - tên của check
# %description% - mô tả của check
# %vl% - số lần vi phạm
# %verbose% - thông tin bổ sung
# %player% - tên người chơi
# [alert] - lệnh đặc biệt để gửi cảnh báo
# [webhook] - lệnh đặc biệt để gửi cảnh báo đến webhook Discord
# [proxy] - lệnh đặc biệt để gửi cảnh báo đến các server khác trong proxy (BungeeCord/Velocity)

Punishments:
  Simulation:
    # Sau bao nhiêu giây thì vi phạm được xóa?
    remove-violations-after: 300
    # Phần này khớp với mọi check có tên tương ứng,
    # Để loại trừ một check lẽ ra được khớp, đặt dấu chấm than trước tên
    # Ví dụ: !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Ngưỡng:Khoảng thời gian Lệnh
    #
    # N là số vi phạm đang hoạt động cần có để chạy lệnh.
    # Vi phạm đang hoạt động được đếm trong khoảng thời gian remove-violations-after.
    # M > 0 chạy tại N, rồi N+M, N+2M, ...
    # M = 0 chỉ chạy một lần khi đạt N.
    #
    # Ví dụ:
    # - "100:0 kick %player% incorrect movement!"   chạy một lần tại vi phạm 100
    # - "100:50 say %player% is cheating"           chạy tại các vi phạm 100, 150, 200, ...
    # - "5:3 [alert]"                               chạy tại các vi phạm 5, 8, 11, 14, ...
    #
    commands:
      - "100:40 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  # Từ phiên bản 2.2.10 chưa có check AutoClicker, đây chỉ là chỗ dự phòng. Grim sẽ thêm check AutoClicker trong tương lai.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
