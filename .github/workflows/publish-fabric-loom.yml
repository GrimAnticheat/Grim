name: Publish patched Fabric Loom

on:
    workflow_dispatch:
        inputs:
            loom-ref:
                description: 'Fabric Loom ref to patch'
                required: true
                default: '1.17.21'

jobs:
    publish:
        runs-on: ["${{ format('ix-ci-run-{0}-{1}-publish-loom', github.run_id, github.run_attempt) }}"]
        permissions:
            contents: read
        steps:
            - name: Checkout Grim
              uses: actions/checkout@v6
              with:
                  path: grim

            - name: Checkout Fabric Loom
              uses: actions/checkout@v6
              with:
                  repository: FabricMC/fabric-loom
                  ref: ${{ inputs.loom-ref }}
                  path: fabric-loom

            - name: Apply layered mappings cache fix
              working-directory: fabric-loom
              run: git apply ../grim/gradle/fabric-loom-layered-mappings.patch

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: '21'
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Publish patched Loom snapshot
              working-directory: fabric-loom
              run: ./gradlew publish --no-daemon --console=plain
              env:
                  MAVEN_URL: https://maven.grim.ac/private/snapshots
                  MAVEN_USERNAME: ${{ secrets.ENGINE_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.ENGINE_PASSWORD }}
