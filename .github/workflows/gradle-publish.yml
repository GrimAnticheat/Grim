# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Gradle Package

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # server-id/settings-path are only needed for publishing to Maven repos like GH Packages

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # Handles Gradle wrapper validation and basic caching

      - name: Cache Gradle Loom Cache
        uses: actions/cache@v4
        with:
          path: .gradle/loom-cache # Path to Loom cache relative to workspace root
          key: loom-cache-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml', 'fabric/**/build.gradle.kts') }}
          restore-keys: |
            loom-cache-${{ runner.os }}-

      # --- Profiling Section ---
      - name: Install gradle-profiler
        run: |
          echo "Installing Gradle Profiler..."
          # --- Updated Version ---
          PROFILER_VERSION="0.22.0"
          # --- Filename from the provided URL ---
          PROFILER_FILENAME="gradle-profiler-${PROFILER_VERSION}.zip"
          # --- Expected directory name after unzipping ---
          PROFILER_DIR="gradle-profiler-${PROFILER_VERSION}"
          # --- Direct Maven Central URL ---
          PROFILER_URL="https://repo1.maven.org/maven2/org/gradle/profiler/gradle-profiler/${PROFILER_VERSION}/${PROFILER_FILENAME}"
          
          echo "Downloading ${PROFILER_FILENAME} from ${PROFILER_URL}..."
          # Use --fail -L for robustness and following redirects
          curl --fail -L -o "${PROFILER_FILENAME}" "${PROFILER_URL}"
          
          echo "Unzipping ${PROFILER_FILENAME}..."
          # Use -q for quieter unzip
          unzip -q "${PROFILER_FILENAME}"
          
          echo "Adding profiler (${PROFILER_DIR}/bin) to PATH..."
          echo "$(pwd)/${PROFILER_DIR}/bin" >> $GITHUB_PATH
          
          echo "Gradle Profiler ${PROFILER_VERSION} installed."

      # --- MODIFIED PROFILER STEP ---
      - name: Profile Build with Gradle Profiler (Build Scan for Slow Run using CLI) # Updated step name
        run: |
          echo "Running Gradle Profiler with Build Scan, forcing clean conditions via CLI invoker..."

          # Define scenario specifying the 'no-daemon-cli' invoker
          # and cache arguments at the top level.
          SCENARIO_CONTENT="

          # Arguments to pass to Gradle (caching only, daemon handled by invoker)
          # Use the CORRECT key 'gradle-args' with a HYPHEN

          # Scenario definition (what to run)
          profile_build_clean { # Changed scenario name for clarity
            tasks = [\"build\"]
            gradle-args = [\"--no-build-cache\", \"--no-configuration-cache\"]
            invoker = \"no-daemon-cli\"
          }
          "
          echo "$SCENARIO_CONTENT" > profiler.scenario
          echo "Scenario file created:"
          cat profiler.scenario

          # Run profiler - it will now use the specified invoker and args
          gradle-profiler \
            --profile buildscan \
            --warmups 1 \
            --iterations 1 \
            --project-dir . \
            --scenario-file profiler.scenario

          echo "Gradle Profiler finished. Build scan link for the 'clean' run should be in the log."
      # --- END MODIFIED PROFILER STEP ---

      - name: Upload Profiler Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: gradle-profiler-benchmark-report # Artifact name in GitHub Actions UI
          path: profile-out/ # Directory created by gradle-profiler
          if-no-files-found: error # Fail if reports weren't generated
      # --- End Profiling Section ---

      - name: Build with Gradle (Actual Build for Artifacts)
        # This step runs after profiling to ensure artifacts are generated if needed
        # It might benefit from caches populated during profiling runs
        run: ./gradlew build

      - name: Upload Bukkit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grimac-bukkit
          # Adding if-no-files-found for robustness
          path: ${{ github.workspace }}/bukkit/build/libs/grimac-bukkit-*.jar
          if-no-files-found: error

      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grimac-fabric
          # Adding if-no-files-found for robustness
          path: ${{ github.workspace }}/fabric/build/libs/grimac-fabric-*.jar
          if-no-files-found: error