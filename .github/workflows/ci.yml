name: CI

on:
    workflow_dispatch:
    # Validate workflow and build-system changes on the default branch without
    # entering the publishing workflow.
    push:
        branches:
            - '2.0'
        paths:
            - '.github/**'
    pull_request:
        branches:
            - '2.0'

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        # Same-repository branches use the seeded IX machine. Forks run on a
        # standard GitHub-hosted runner and never receive IX or repository secrets.
        runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'ix' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  # Pull requests and IX seed runs restore state without
                  # uploading or requiring an encryption secret.
                  cache-read-only: true

            - name: Build
              run: ./gradlew build --no-daemon --configuration-cache
