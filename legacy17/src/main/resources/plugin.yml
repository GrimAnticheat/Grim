name: GrimLegacyAC
main: ac.grim.legacyac.LegacyAntiCheatPlugin
version: 0.8.0
author: GrimLegacy Team
website: https://grim.ac
description: Legacy anti-cheat inspired by Grim design ideas, for 1.7.10 servers
commands:
  glac:
    description: GrimLegacyAC main command
    usage: /glac <alerts|reload|info|profile>
    permission: grimlegacy.command
permissions:
  grimlegacy.alerts:
    description: Receive GrimLegacy alerts
    default: op
  grimlegacy.command:
    description: Use GrimLegacy command
    default: op
  grimlegacy.bypass:
    description: Bypass checks
    default: false
