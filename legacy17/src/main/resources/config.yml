# GrimLegacyAC default config
# 1.7.10 focused baseline checks inspired by Grim architecture ideas.
violation-decay-per-second: 0.08

alerts:
  console: true
  require-subscription: false

protocollib:
  enabled: true

netty:
  inject-on-join: true
  strict-reflection: false

# packet-first 优先使用包级事件；当其数据过期或缺失时，按 stale 窗口回退到 Bukkit 事件。
pipeline:
  packet-first: true
  bukkit-fallback: true
  bukkit-fallback-stale-nanos: 150000000

exempt:
  join-grace-ms: 2500
  teleport-grace-ms: 1000
  velocity-grace-ms: 400

prediction:
  max-packet-age-nanos: 120000000
  shadow-deviation-threshold: 0.15
  min-moving-horizontal: 0.03
  min-moving-vertical: 0.03
  lag-tolerance: 0.08
  lag-small-tolerance: 0.03
  velocity-pending-tolerance: 0.04
  recovery-after-high-fall-ticks: 8
  stage:
    base-allowance: 0.0
    soft-buffer-threshold: 0.35
    hard-flag-streak: 3
  budget:
    base: 0.012
    recent-velocity: 0.022
    stuck-speed: 0.018
    liquid: 0.03
    near-glitchy-block: 0.016
    point-three: 0.018
    rod-pull: 0.04
    entity-hard-collision: 0.02
    high-fall-recovery: 0.05
    teleport: 0.02

transaction:
  enabled: true
  interval-ticks: 20
  max-ack-age-ms: 4000

combat:
  backtrack-window-ms: 400
  reach-teleport-grace-ms: 350

heuristics:
  window-decay: 0.95

adaptive-lag:
  jitter-threshold-ms: 50
  min-tps: 18.0
  reach-extra-distance: 0.15
  speed-tolerance-multiplier: 1.15
  speed-small-margin: 0.03
  pending-state-margin: 0.06
  compare-log-enabled: true




checks:
  Speed:
    enabled: true
    max-vl: 12.0
    setback: true
    buffer: 0.35
    window-weight: 1.0
    prediction-base-allowance: 0.0
    direction-min-horizontal: 0.06
    turning-max-yaw-delta: 45.0
    turning-max-direction-deviation: 85.0
    turning-direction-margin: 0.03
    punish-vl: 30
    punish-commands:
      - "kick %player% Speed cheat (%check% VL:%vl%)"
  Fly:
    enabled: true
    max-vl: 10.0
    setback: true
    air-ticks-threshold: 10
    max-dy: 0.02
    buffer: 2.0
    window-weight: 1.0
    parabola-error-threshold: 0.03
    parabola-min-samples: 6
    shadow-min-deviation: 0.12
    punish-vl: 26
    punish-commands:
      - "kick %player% Fly cheat (%check% VL:%vl%)"
  Phase:
    enabled: true
    max-vl: 6.0
    setback: true
    buffer: 1.5
    min-overlap-ratio: 0.08
    min-overlap-volume: 0.018
    min-consecutive-ticks: 3
    thin-min-consecutive-ticks: 5
    punish-vl: 18
    punish-commands:
      - "kick %player% Phase cheat (%check% VL:%vl%)"
  Reach:
    enabled: true
    max-vl: 8.0
    Ray-Distance: 3.1
    setback: false
    buffer: 0.5
    window-weight: 1.0
    strafe-sync-extra-margin: 0.05
    punish-vl: 22
    punish-commands:
      - "kick %player% Reach cheat (%check% VL:%vl%)"
  AutoClicker:
    enabled: true
    max-vl: 10.0
    max-cps: 17
    setback: false
    buffer: 1.5
    punish-vl: 25
    punish-commands:
      - "kick %player% AutoClicker (%check% VL:%vl%)"
  NoFall:
    enabled: true
    max-vl: 6.0
    setback: false
    min-air-ticks: 6
    buffer: 1.5
    punish-vl: 16
    punish-commands:
      - "kick %player% NoFall cheat (%check% VL:%vl%)"
  KillAura:
    enabled: true
    max-vl: 7.0
    setback: false
    snap-threshold: 75.0
    buffer: 2.0
    multi-target-buffer: 3.0
    punish-vl: 20
    punish-commands:
      - "kick %player% KillAura cheat (%check% VL:%vl%)"
  Timer:
    enabled: true
    max-vl: 8.0
    setback: false
    max-moves-per-second: 26
    buffer: 2.0
    punish-vl: 20
    punish-commands:
      - "kick %player% Timer cheat (%check% VL:%vl%)"
  Knockback:
    enabled: true
    max-vl: 8.0
    setback: true
    threshold: 0.001
    max-advantage: 1.0
    immediate-setback-threshold: 0.10
    setback-decay-multiplier: 0.999
    max-ceiling: 4.0
    tx-window-max-ms: 500
    delayed-window-ticks: 3
    min-samples: 2
    window-ticks: 8
    buffer: 1.2
    punish-vl: 20
    punish-commands:
      - "kick %player% Knockback cheat (%check% VL:%vl%)"
  Velocity:
    enabled: true
    max-vl: 8.0
    setback: false
    tx-window-max-ms: 500
    delayed-kb-ticks: 3
    min-score-to-flag: 1.2
    min-samples: 2
    # legacy compatibility
    window-ticks: 8
    min-expected-xz: 0.08
    min-response-ratio-xz: 0.40
    min-response-ratio-y: 0.25
    buffer: 1.2
    window-weight: 1.0
    punish-vl: 20
    punish-commands:
      - "kick %player% Velocity cheat (%check% VL:%vl%)"
  Jesus:
    enabled: true
    max-vl: 8.0
    setback: true
    max-water-speed: 0.18
    buffer: 0.25
    punish-vl: 20
    punish-commands:
      - "kick %player% Jesus cheat (%check% VL:%vl%)"
  FastPlace:
    enabled: true
    max-vl: 8.0
    setback: false
    max-place-per-second: 14
    buffer: 1.5
    punish-vl: 20
    punish-commands:
      - "kick %player% FastPlace cheat (%check% VL:%vl%)"
  FastBreak:
    enabled: true
    max-vl: 8.0
    setback: false
    max-break-per-second: 12
    buffer: 1.5
    punish-vl: 20
    punish-commands:
      - "kick %player% FastBreak cheat (%check% VL:%vl%)"
  FastUse:
    enabled: true
    max-vl: 8.0
    setback: false
    max-consume-per-second: 2
    buffer: 1.0
    punish-vl: 14
    punish-commands:
      - "kick %player% FastUse cheat (%check% VL:%vl%)"
  InventoryMove:
    enabled: true
    max-vl: 8.0
    setback: false
    max-move: 0.12
    buffer: 0.2
    window-weight: 1.0
    punish-vl: 18
    punish-commands:
      - "kick %player% InventoryMove cheat (%check% VL:%vl%)"

  Prediction:
    enabled: true
    max-vl: 10.0
    setback: true
    buffer: 1.2
    window-weight: 1.0
    punish-vl: 25
    punish-commands:
      - "kick %player% Prediction cheat (%check% VL:%vl%)"

  NoSlow:
    enabled: true
    max-vl: 8.0
    setback: false
    slow-factor: 0.2
    min-using-ticks: 2
    min-consecutive-violation-ticks: 2
    slot-switch-grace-ticks: 2
    prediction-min-deviation-threshold: 0.035
    buffer: 0.4
    window-weight: 1.0
    punish-vl: 18
    punish-commands:
      - "kick %player% NoSlow cheat (%check% VL:%vl%)"
