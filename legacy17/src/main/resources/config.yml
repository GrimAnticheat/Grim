# GrimLegacyAC default config
# 1.7.10 focused baseline checks inspired by Grim architecture ideas.
violation-decay-per-second: 0.08

alerts:
  console: true
  require-subscription: false

protocollib:
  enabled: true
  strict-reflection: false

netty:
  inject-on-join: true
  strict-reflection: false

# packet-first 娴兼ê鍘涙担璺ㄦ暏閸栧懐楠囨禍瀣╂閿涙稑缍嬮崗鑸垫殶閹诡喛绻冮張鐔稿灗缂傚搫銇戦弮璁圭礉 stale 缁愭褰涢崶鐐衡偓鈧?Bukkit 娴滃娆?
pipeline:
  packet-first: true
  bukkit-fallback: true
  bukkit-fallback-stale-nanos: 150000000
  legacy-onmove-fallback: false
  minimal-post-on-prediction-miss: true
  minimal-post:
    thresholds:
      speed-horizontal: 0.85
      speed-max-dy: 0.42
      speed-buffer-scale: 0.35
      speed-buffer: 4.5
      speed-budget-multiplier: 3.0
      fly-air-ticks: 14
      fly-max-dy: 0.035
      fly-slack-multiplier: 30.0
      fly-dy-budget-multiplier: 0.8
      phase-min-overlap-ratio: 0.16
      phase-ratio-budget-multiplier: 0.8
      phase-min-overlap-volume: 0.05
      phase-volume-budget-multiplier: 0.25
      groundspoof-min-ticks: 5
      groundspoof-buffer: 4.0
      groundspoof-slack-multiplier: 40.0
      groundspoof-budget-multiplier: 8.0

exempt:
  join-grace-ms: 2500
  teleport-grace-ms: 1000
  velocity-grace-ms: 400

prediction:
  max-packet-age-nanos: 120000000
  shadow-deviation-threshold: 0.15
  min-moving-horizontal: 0.03
  min-moving-vertical: 0.03
  lag-tolerance: 0.08
  terrain-alert-floor: 0.08
  ice-alert-floor: 0.105
  head-hit-alert-floor: 0.115
  utility-alert-floor: 0.14
  speed-alert-floor: 0.095
  tower-alert-floor: 0.18
  landing-extra-tolerance: 0.12
  landing-alert-floor: 0.22
  lag-small-tolerance: 0.03
  velocity-pending-tolerance: 0.04
  recovery-after-high-fall-ticks: 8
  budget:
    base: 0.060
    recent-velocity: 0.18
    stuck-speed: 0.050
    liquid: 0.065
    near-glitchy-block: 0.045
    point-three: 0.045
    rod-pull: 0.080
    entity-hard-collision: 0.060
    high-fall-recovery: 0.16
    teleport: 0.15
    uneven-ground: 0.05
    snow-layer: 0.06
    partial-ground: 0.04
    ice-ground: 0.07
    head-hit: 0.09
    uneven-fall: 0.08
    inventory-air: 0.05
    use-item-air: 0.05
    air-sprint-jump: 0.03

# Simulation settings  mirrors Grim OffsetHandler pattern
Simulation:
  threshold: 0.045
  immediate-setback-threshold: 0.30
  max-advantage: 1.2
  max-ceiling: 5.0
  setback-decay-multiplier: 0.98
  linear-decay-per-tick: 0.08

transaction:
  enabled: true
  interval-ticks: 20
  max-ack-age-ms: 4000

combat:
  backtrack-window-ms: 400
  reach-teleport-grace-ms: 500

heuristics:
  window-decay: 0.90

adaptive-lag:
  jitter-threshold-ms: 40
  min-tps: 18.0
  reach-extra-distance: 0.12
  speed-tolerance-multiplier: 1.35
  speed-small-margin: 0.05
  pending-state-margin: 0.10
  compare-log-enabled: true

checks:
  Speed:
    enabled: true
    max-vl: 12.0
    setback: true
    threshold: 0.045
    max-advantage: 0.8
    immediate-setback-threshold: 0.30
    setback-decay-multiplier: 0.98
    linear-decay-per-tick: 0.08
    buffer: 0.45
    window-weight: 1.0
    prediction-base-allowance: 0.08
    punish-vl: 30
    punish-commands:
      - "kick %player% Speed cheat (%check% VL:%vl%)"
  Fly:
    enabled: true
    max-vl: 10.0
    setback: true
    air-ticks-threshold: 10
    max-dy: 0.02
    buffer: 2.0
    window-weight: 1.0
    parabola-error-threshold: 0.03
    parabola-min-samples: 6
    shadow-min-deviation: 0.12
    punish-vl: 26
    punish-commands:
      - "kick %player% Fly cheat (%check% VL:%vl%)"
  Phase:
